name: build

on:
  push:
    branches: [main]
    paths:
      - "apps/backend-api/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPO: backend-api
  TF_ROLE_ARN: arn:aws:iam::<update me>:role/github-actions-terraform

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: set up QEMU (emulation for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: image digest
        run: echo "pushed ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}"
